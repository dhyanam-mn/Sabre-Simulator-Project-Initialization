[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sabre"
version = "0.1.0"
description = "Security- and Behaviour-Aware Predictive CPU Scheduling with Adaptive Resource Allocation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Khushi Srivastava"},
    {name = "Aadya Singh"},
    {name = "Dhyanam Mahajan"}
]
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "pyyaml>=6.0",
    "pytest>=7.0.0",
    "hypothesis>=6.50.0",
    "scikit-learn>=1.2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sabre*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
